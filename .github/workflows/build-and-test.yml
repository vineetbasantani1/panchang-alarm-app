name: Build and Test Core Library

# Runs on GitHub's macOS runner. FREE and UNLIMITED on public repositories.
# Tests only PanchangAlarmCore (the verified tithi-calculation logic) —
# this is a plain Swift Package, so `swift build`/`swift test` is reliable
# and doesn't depend on any Xcode project file or app-specific machinery.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build PanchangAlarmCore
        run: swift build -v

      - name: Run unit tests
        run: swift test -v
