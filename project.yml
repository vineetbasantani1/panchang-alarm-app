name: PanchangAlarm
options:
  bundleIdPrefix: com.vineetbasantani
  deploymentTarget:
    iOS: "26.0"

packages:
  PanchangAlarmCore:
    path: .

targets:
  PanchangAlarm:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AppSources
    dependencies:
      - package: PanchangAlarmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vineetbasantani.panchangalarm
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAlarmKitUsageDescription: "Used to ring an alarm on your chosen fasting/observance days."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait

  PanchangAlarmUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: PanchangAlarm

schemes:
  PanchangAlarm:
    build:
      targets:
        PanchangAlarm: all
        PanchangAlarmUITests: [test]
    test:
      targets:
        - PanchangAlarmUITests
